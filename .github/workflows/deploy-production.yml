name: Production deployment

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: production-deployment
  cancel-in-progress: false

jobs:
  deploy:
    name: Migrate and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: production

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      # Apply pending migrations BEFORE building/deploying so the database is
      # ready for the new code. Uses the same connection the app uses at
      # runtime (session pooler as DATABASE_URL, direct connection as DIRECT_URL).
      - name: Reconcile known schema drift
        run: npx tsx scripts/reconcile-prod.ts
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_SESSION_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}

      - name: Apply Prisma migrations
        run: |
          if ! npx prisma migrate deploy; then
            # A prior partial apply left the schema drifted (e.g. the roles
            # table existed before its migration). The reconcile step above
            # already repaired the schema, so mark the migration as applied
            # and retry to apply any remaining pending migrations.
            npx prisma migrate resolve --applied 20260803130000_add_roles || true
            npx prisma migrate deploy
          fi
        env:
          DATABASE_URL: ${{ secrets.SUPABASE_SESSION_URL }}
          DIRECT_URL: ${{ secrets.SUPABASE_DIRECT_URL }}

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Pull Vercel production configuration
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build production artifact
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}

      - name: Deploy production artifact
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}

  notify:
    name: Send Telegram notification
    needs: deploy
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Send deploy result to Telegram
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: |
          if [ "${{ needs.deploy.result }}" = "success" ]; then
            STATUS="🚀 Deploy concluído"
            MSG="Produção atualizada com sucesso!"
          else
            STATUS="❌ Deploy falhou"
            MSG="Verifique os logs do GitHub Actions."
          fi

          COMMIT_MSG=$(echo "${{ github.event.head_commit.message }}" | head -1)

          TEXT="${STATUS}%0A%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.ref_name }}%0ACommit: ${{ github.sha }}%0AMessage: ${COMMIT_MSG}%0AAuthor: ${{ github.actor }}%0A%0A${MSG}%0A%0AVer workflow: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="${TEXT}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
