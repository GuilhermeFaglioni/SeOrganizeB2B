name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate application
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_URL: postgresql://ci:ci@localhost:5432/ci

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Verify migrations apply cleanly
        run: npx prisma migrate deploy

      - name: Ensure authenticated role can access public schema
        run: |
          PGPASSWORD=ci psql -h localhost -U ci -d ci -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'authenticated') THEN
              CREATE ROLE authenticated NOLOGIN;
            END IF;
          END $$;
          GRANT USAGE ON SCHEMA public TO authenticated;
          GRANT SELECT, INSERT, UPDATE, DELETE ON ALL TABLES IN SCHEMA public TO authenticated;
          SQL

      - name: Run tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npx tsc --noEmit

      - name: Enable auto-merge
        if: success() && github.event_name == 'pull_request'
        run: gh pr merge --auto --squash "${{ github.event.pull_request.html_url }}"
        env:
          GH_TOKEN: ${{ secrets.PAT_TOKEN }}

  notify:
    name: Send Telegram notification
    needs: validate
    runs-on: ubuntu-latest
    if: always() && github.event_name == 'pull_request'

    steps:
      - name: Send CI result to Telegram
        if: env.TELEGRAM_BOT_TOKEN != ''
        run: |
          if [ "${{ needs.validate.result }}" = "success" ]; then
            STATUS="✅ CI Passed"
            MSG="Tudo OK! Auto-merge habilitado."
          else
            STATUS="❌ CI Failed"
            MSG="Verifique os logs do GitHub Actions."
          fi

          TEXT="${STATUS}%0A%0ARepo: ${{ github.repository }}%0ABranch: ${{ github.head_ref }}%0ACommit: ${{ github.event.pull_request.head.sha }}%0AAuthor: ${{ github.actor }}%0A%0A${MSG}%0A%0AVer PR: ${{ github.event.pull_request.html_url }}"

          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendMessage" \
            -d chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
            -d parse_mode="Markdown" \
            -d text="${TEXT}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
